<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
      <div style="background:#ffecec;color:#c00;padding:10px;margin-bottom:10px;border-radius:6px;">
        {% for m in msgs %}
          <div>{{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main style="max-width:540px;margin:40px auto;padding:20px;background:#fff;border:1px solid #eee;border-radius:6px;">
    <h2>Login</h2>
    <form method="post">
      <label>Username<br><input name="username" required style="padding:8px;width:100%;margin:6px 0;border:1px solid #ddd;border-radius:4px"></label>
      <label>Password<br><input type="password" name="password" required style="padding:8px;width:100%;margin:6px 0;border:1px solid #ddd;border-radius:4px"></label>
      <button type="submit" style="padding:8px 12px;background:#0095f6;color:#fff;border:none;border-radius:4px;cursor:pointer">Login</button>
    </form>
    <p style="margin-top:10px"><a href="{{ url_for('register') }}">New? Register</a></p>
  </main>
</body>
</html>
