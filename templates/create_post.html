<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create Post</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <main style="max-width:540px;margin:40px auto;padding:20px;background:#fff;border:1px solid #eee;border-radius:6px;">
    <h2>New Post</h2>
    <form method="post" enctype="multipart/form-data">
      <label>Image<br><input type="file" name="image" accept="image/*" required></label><br><br>
      <label>Caption<br><input name="caption" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px"></label><br><br>
      <button type="submit" style="padding:8px 12px;background:#0095f6;color:#fff;border:none;border-radius:4px;cursor:pointer">Post</button>
    </form>
    <p style="margin-top:10px"><a href="{{ url_for('index') }}">Back to feed</a></p>
  </main>
</body>
</html>
