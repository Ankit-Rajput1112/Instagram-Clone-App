<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <main style="max-width:540px;margin:40px auto;padding:20px;background:#fff;border:1px solid #eee;border-radius:6px;">
    <h2>Register</h2>
    <form method="post">
      <label>Username<br><input name="username" required style="padding:8px;width:100%;margin:6px 0;border:1px solid #ddd;border-radius:4px"></label>
      <label>Password<br><input type="password" name="password" required style="padding:8px;width:100%;margin:6px 0;border:1px solid #ddd;border-radius:4px"></label>
      <button type="submit" style="padding:8px 12px;background:#0095f6;color:#fff;border:none;border-radius:4px;cursor:pointer">Register</button>
    </form>
    <p style="margin-top:10px"><a href="{{ url_for('login') }}">Already have an account? Login</a></p>
  </main>
</body>
</html>
